Il punto chiave è che la sintassi è sbagliata, molto probabil you had earlier:
- `on: workflow_dispatch:`
- `jobs: register: runs-on: ubuntu-latest steps: ...`

That is all collapsed onto one line / wrong YAML nesting.

The correct format is:

