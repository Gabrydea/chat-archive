name: Register Discord Commands

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Debug environment
        run: |
          echo "Node version:" && node -v
          echo "pnpm version:" && pnpm -v
          echo "List repo root:" && ls -la
          echo "Check scripts file exists:" && [ -f ./scripts/register-commands.ts ] && echo "OK" || echo "MISSING"

      - name: Install dependencies (with fallback)
        run: |
          pnpm install --frozen-lockfile || pnpm install

      - name: Register slash commands
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: pnpm dlx tsx ./scripts/register-commands.ts
